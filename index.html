<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Quality & Company employee profile"
  >

  <title>Quality & Company Employee Profile</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="site">

    <header class="site-header">
      <div class="header-inner">
        <a
          href="https://www.qualityandcompany.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Quality & Company website"
        >
          <img
            src="Logo.png"
            alt="Quality & Company"
            class="site-logo"
          >
        </a>
      </div>
    </header>

    <main class="page-shell">

      <section
        id="loading"
        class="message-card"
      >
        Loading employee profile…
      </section>

      <section
        id="error"
        class="message-card"
        hidden
      >
        <h1>Employee not found</h1>
        <p>Please confirm the QR code or employee link.</p>
      </section>

      <article
        id="profile"
        class="profile"
        hidden
      >

        <div class="photo-column">
          <div class="photo-wrap">
            <img
              id="photo"
              alt="Employee photo"
            >
          </div>
        </div>

        <div class="details">

          <div class="profile-heading">
            <span
              id="status"
              class="badge"
            ></span>

            <h1
              id="name"
              class="employee-name"
            ></h1>

            <p
              id="jobTitle"
              class="job"
            ></p>

            <p
              id="department"
              class="department"
            ></p>
          </div>

          <div class="divider"></div>

          <section class="contact-section">
            <h2>Contact Information</h2>

            <dl class="details-grid">

              <div
                id="employeeIdRow"
                class="detail-item"
              >
                <dt>Employee ID</dt>
                <dd id="employeeId"></dd>
              </div>

              <div
                id="emailRow"
                class="detail-item"
              >
                <dt>Email</dt>
                <dd>
                  <a id="email"></a>
                </dd>
              </div>

              <div
                id="workPhoneRow"
                class="detail-item"
              >
                <dt>Work Phone</dt>
                <dd>
                  <a id="workPhone"></a>
                </dd>
              </div>

              <div
                id="cellPhoneRow"
                class="detail-item"
              >
                <dt>Cell Phone</dt>
                <dd>
                  <a id="cellPhone"></a>
                </dd>
              </div>

            </dl>
          </section>

          <div class="profile-actions">

            <a
              id="emailButton"
              class="button button-primary"
              hidden
            >
              Send Email
            </a>

            <a
              id="phoneButton"
              class="button button-secondary"
              hidden
            >
              Call
            </a>

          </div>

        </div>
      </article>

    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>
          © <span id="year"></span> Quality & Company Inc.
        </p>

        <a
          href="https://www.qualityandcompany.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          www.qualityandcompany.com
        </a>
      </div>
    </footer>

  </div>

  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();
  </script>

  <script src="app.js"></script>
</body>
</html>
