<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Quality & Company employee profile"
  >

  <title>Quality & Company Employee Profile</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="shell">

    <header class="profile-header">
      <a
        href="https://www.qualityandcompany.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="Logo.png"
          alt="Quality & Company"
          class="logo"
        >
      </a>
    </header>

    <section id="loading" class="message-card">
      Loading employee profile…
    </section>

    <section id="error" class="message-card" hidden>
      <h1>Employee not found</h1>
      <p>Please confirm the QR code or employee link.</p>
    </section>

    <article id="profile" class="profile" hidden>

      <div class="photo-wrap">
        <img id="photo" alt="Employee photo">
      </div>

      <div class="details">

        <span id="status" class="badge"></span>

        <h1 id="name"></h1>

        <p id="jobTitle" class="job"></p>

        <p id="department" class="department"></p>

        <dl class="contact-grid">

          <div id="employeeIdRow" class="contact-item">
            <dt>Employee ID</dt>
            <dd id="employeeId"></dd>
          </div>

          <div id="emailRow" class="contact-item">
            <dt>Email</dt>
            <dd>
              <a id="email"></a>
            </dd>
          </div>

          <div id="workPhoneRow" class="contact-item">
            <dt>Work Phone</dt>
            <dd>
              <a id="workPhone"></a>
            </dd>
          </div>

          <div id="cellPhoneRow" class="contact-item">
            <dt>Cell Phone</dt>
            <dd>
              <a id="cellPhone"></a>
            </dd>
          </div>

        </dl>

        <div class="profile-actions">

          <a
            id="emailButton"
            class="button button-primary"
            hidden
          >
            Send Email
          </a>

          <a
            id="phoneButton"
            class="button button-secondary"
            hidden
          >
            Call
          </a>

        </div>

      </div>
    </article>

  </main>

  <footer class="footer">
    <div class="shell footer-content">
      <p>
        © <span id="year"></span> Quality & Company Inc.
      </p>

      <a
        href="https://www.qualityandcompany.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        www.qualityandcompany.com
      </a>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();
  </script>

  <script src="app.js"></script>
</body>
</html>
