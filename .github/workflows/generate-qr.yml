name: Generate Employee QR Codes

on:
  push:
    branches:
      - main
    paths:
      - "employees/**"
      - "images/**"
      - "scripts/generate-qr.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate-qr.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: employee-qr-generation
  cancel-in-progress: true

jobs:
  generate-qr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Generate employee QR codes
        run: npm run generate-qr

      - name: Commit generated QR files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A qr package-lock.json

          echo "Files staged for commit:"
          git status --short

          if git diff --cached --quiet; then
            echo "No QR changes to commit."
            exit 0
          fi

          git commit -m "Generate employee QR codes"
          git push
